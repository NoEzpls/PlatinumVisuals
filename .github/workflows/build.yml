name: Build Platinum Visuals JAR

on:
  workflow_dispatch:
  push:
    branches: [main, work]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify
        run: ./gradlew clean check build

      - name: Show produced JARs
        run: find build/libs -maxdepth 1 -type f -name '*.jar' -printf '%f\n'

      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: platinum-visuals-neoforge-1.21.11-1.6.0
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
